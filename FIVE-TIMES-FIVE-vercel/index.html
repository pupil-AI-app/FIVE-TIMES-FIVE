<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ed">
<title>FIVE TIMES FIVE</title>

<style>
:root{
  --ink:#1f2a44;
  --paper:#f7f4ed;
  --card:#fffdf8;
  --accent:#e36b45;
  --line:#d9d4ca;
  --muted:#73736e;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:var(--paper);
  color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,sans-serif;
}

.app{
  width:min(680px,100%);
  min-height:100vh;
  margin:auto;
  padding:28px 18px 22px;
  display:flex;
  flex-direction:column;
}

header{
  text-align:center;
  margin:4px auto 22px;
  max-width:550px;
}

.robot-icon{
  display:block;
  width:92px;
  height:92px;
  object-fit:contain;
  margin:0 auto 12px;
}

h1{
  margin:0;
  font-size:clamp(34px,9vw,54px);
  line-height:1;
  letter-spacing:-1.8px;
}

.rule{
  margin:13px auto 0;
  max-width:500px;
  font-size:16px;
  line-height:1.5;
  color:#474d59;
}

.rule strong{
  color:var(--ink);
}

#messages{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:11px;
  padding:6px 0 20px;
}

.message{
  max-width:86%;
  padding:12px 14px;
  border-radius:18px;
  line-height:1.4;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}

.user{
  align-self:flex-end;
  background:var(--ink);
  color:#fff;
  border-bottom-right-radius:5px;
}

.assistant{
  align-self:flex-start;
  background:var(--card);
  border:1px solid var(--line);
  border-bottom-left-radius:5px;
}

.status{
  align-self:center;
  font-size:13px;
  color:var(--muted);
  text-align:center;
}

form{
  position:sticky;
  bottom:0;
  padding-top:14px;
  padding-bottom:max(0px,env(safe-area-inset-bottom));
  background:linear-gradient(
    to bottom,
    rgba(247,244,237,0),
    var(--paper) 20%
  );
}

.input-row{
  display:flex;
  gap:8px;
  align-items:flex-end;
  padding:7px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 5px 20px rgba(31,42,68,.06);
}

textarea{
  flex:1;
  resize:none;
  min-height:48px;
  max-height:140px;
  border:0;
  outline:0;
  padding:12px 10px;
  font:inherit;
  color:var(--ink);
  background:transparent;
}

textarea::placeholder{
  color:#92928d;
}

button{
  border:0;
  font:inherit;
  font-weight:750;
  cursor:pointer;
}

#send{
  min-width:70px;
  min-height:48px;
  border-radius:14px;
  padding:0 16px;
  background:var(--accent);
  color:#fff;
}

#send:disabled{
  opacity:.45;
  cursor:default;
}

.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:8px;
  padding:0 4px;
}

#reset{
  background:transparent;
  color:var(--muted);
  padding:6px 0;
  font-size:13px;
}

#count{
  color:var(--muted);
  font-size:13px;
}

.notice{
  margin:7px auto 0;
  max-width:560px;
  padding:0 6px;
  color:var(--muted);
  font-size:11px;
  line-height:1.35;
  text-align:center;
}

#congrats{
  position:fixed;
  top:20px;
  left:50%;
  transform:translate(-50%,-12px) scale(.97);
  z-index:1000;
  padding:10px 16px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  box-shadow:0 8px 26px rgba(31,42,68,.16);
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;
}

#congrats.show{
  opacity:1;
  transform:translate(-50%,0) scale(1);
}

#congrats strong{
  display:block;
  font-size:15px;
}

#congrats span{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:12px;
}
</style>
</head>

<body>

<div id="congrats" role="status" aria-live="assertive">
  <strong>🎉 CONGRATS!</strong>
  <span>You broke the guardrail.</span>
</div>

<main class="app">

<header>
  <img
    class="robot-icon"
    src="/Math%20Icon.png"
    alt=""
    aria-hidden="true"
  >

  <h1>FIVE TIMES FIVE</h1>

  <p class="rule">
    This chatbot has one rule:
    <strong>teach you how to solve 5 × 5 without giving away the answer.</strong>
  </p>
</header>

<section id="messages" aria-live="polite"></section>

<form id="chat-form">

  <div class="input-row">

    <textarea
      id="input"
      maxlength="2000"
      placeholder="Ask the tutor anything…"
      required
    ></textarea>

    <button id="send" type="submit">
      Send
    </button>

  </div>

  <div class="controls">

    <button id="reset" type="button">
      Reset conversation
    </button>

    <span id="count">
      0 / 20 messages
    </span>

  </div>

  <p class="notice">
    Conversations are anonymously recorded for review after this session.
    Please do not enter personal information.
  </p>

</form>

</main>

<script>

const form = document.getElementById("chat-form");
const input = document.getElementById("input");
const messagesEl = document.getElementById("messages");
const send = document.getElementById("send");
const reset = document.getElementById("reset");
const count = document.getElementById("count");
const congrats = document.getElementById("congrats");

const MAX = 20;

let messages = [];
let sessionId = crypto.randomUUID();
let congratsTimer = null;

function add(role,text,cls=""){
  const d = document.createElement("div");

  d.className = cls || `message ${role}`;
  d.textContent = text;

  messagesEl.appendChild(d);

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

  return d;
}

function showOpeningMessage(){
  add(
    "assistant",
    "Ready when you are — where should we start?"
  );
}

function update(){

  const n = messages.filter(
    m => m.role === "user"
  ).length;

  count.textContent = `${n} / ${MAX} messages`;

  send.disabled = n >= MAX;
  input.disabled = n >= MAX;

  if(
    n >= MAX &&
    !document.getElementById("limit")
  ){
    const x = add(
      "",
      "20-message limit reached. Reset to try again.",
      "status"
    );

    x.id = "limit";
  }
}

function showCongrats(){

  clearTimeout(congratsTimer);

  congrats.classList.add("show");

  congratsTimer = setTimeout(() => {
    congrats.classList.remove("show");
  },3500);
}

form.addEventListener("submit",async e => {

  e.preventDefault();

  const text = input.value.trim();

  const n = messages.filter(
    m => m.role === "user"
  ).length;

  if(!text || n >= MAX) return;

  messages.push({
    role:"user",
    content:text
  });

  add("user",text);

  input.value = "";
  send.disabled = true;

  const wait = add(
    "",
    "Thinking…",
    "status"
  );

  try{

    const r = await fetch("/api/chat",{
      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        messages,
        sessionId,
        turnNumber:n + 1
      })
    });

    const data = await r.json();

    wait.remove();

    if(!r.ok){
      throw new Error(data.error || "Request failed");
    }

    messages.push({
      role:"assistant",
      content:data.reply
    });

    add(
      "assistant",
      data.reply
    );

    if(data.guardrailBroken){
      showCongrats();
    }

  }catch(error){

    wait.textContent =
      "Something went wrong. Please try again.";

    messages.pop();

  }finally{

    update();

    if(!input.disabled){
      send.disabled = false;
    }

    input.focus();
  }
});

reset.addEventListener("click",() => {

  messages = [];
  sessionId = crypto.randomUUID();

  messagesEl.innerHTML = "";

  input.disabled = false;
  send.disabled = false;
  input.value = "";

  congrats.classList.remove("show");

  update();
  showOpeningMessage();

  input.focus();
});

input.addEventListener("keydown",e => {

  if(
    e.key === "Enter" &&
    !e.shiftKey
  ){
    e.preventDefault();
    form.requestSubmit();
  }
});

update();
showOpeningMessage();

</script>

</body>
</html>
