<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ed">
<title>FIVE TIMES FIVE</title>

<style>
:root{
  --ink:#1f2a44;
  --paper:#f7f4ed;
  --card:#fffdf8;
  --accent:#e36b45;
  --line:#d9d4ca;
  --muted:#73736e;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:var(--paper);
  color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,sans-serif;
}

.app{
  width:min(680px,100%);
  min-height:100vh;
  margin:auto;
  padding:28px 18px 22px;
  display:flex;
  flex-direction:column;
}

header{
  text-align:center;
  margin:4px auto 22px;
  max-width:550px;
}

.robot-icon{
  display:block;
  width:92px;
  height:92px;
  object-fit:contain;
  margin:0 auto 12px;
}

h1{
  margin:0;
  font-size:clamp(34px,9vw,54px);
  line-height:1;
  letter-spacing:-1.8px;
}

.rule{
  margin:13px auto 0;
  max-width:500px;
  font-size:16px;
  line-height:1.5;
  color:#474d59;
}

.rule strong{
  color:var(--ink);
}

#messages{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:11px;
  padding:6px 0 20px;
}

.message{
  max-width:86%;
  padding:12px 14px;
  border-radius:18px;
  line-height:1.4;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}

.user{
  align-self:flex-end;
  background:var(--ink);
  color:#fff;
  border-bottom-right-radius:5px;
}

.assistant{
  align-self:flex-start;
  background:var(--card);
  border:1px solid var(--line);
  border-bottom-left-radius:5px;
}

.status{
  align-self:center;
  font-size:13px;
  color:var(--muted);
  text-align:center;
}

form{
  position:sticky;
  bottom:0;
  padding-top:14px;
  padding-bottom:max(0px,env(safe-area-inset-bottom));
  background:linear-gradient(
    to bottom,
    rgba(247,244,237,0),
    var(--paper) 20%
  );
}

.input-row{
  display:flex;
  gap:8px;
  align-items:flex-end;
  padding:7px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 5px 20px rgba(31,42,68,.06);
}

textarea{
  flex:1;
  resize:none;
  min-height:48px;
  max-height:140px;
  border:0;
  outline:0;
  padding:12px 10px;
  font:inherit;
  color:var(--ink);
  background:transparent;
}

textarea::placeholder{
  color:#92928d;
}

button{
  border:0;
  font:inherit;
  font-weight:750;
  cursor:pointer;
}

#send{
  min-width:70px;
  min-height:48px;
  border-radius:14px;
  padding:0 16px;
  background:var(--accent);
  color:#fff;
}

#send:disabled{
  opacity:.45;
  cursor:default;
}

.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:8px;
  padding:0 4px;
}

#reset{
  background:transparent;
  color:var(--muted);
  padding:6px 0;
  font-size:13px;
}

#count{
  color:var(--muted);
  font-size:13px;
}

.notice{
  margin:7px auto 0;
  max-width:560px;
  padding:0 6px;
  color:var(--muted);
  font-size:11px;
  line-height:1.35;
  text-align:center;
}


/* FULL-SCREEN SUCCESS OVERLAY */

#congrats{
  position:fixed;
  inset:0;
  z-index:9999;

  display:none;
  align-items:center;
  justify-content:center;

  width:100%;
  height:100%;
  min-height:100dvh;

  padding:
    max(24px,env(safe-area-inset-top))
    max(24px,env(safe-area-inset-right))
    max(24px,env(safe-area-inset-bottom))
    max(24px,env(safe-area-inset-left));

  background:var(--ink);
  color:#fff;

  text-align:center;
}

#congrats.show{
  display:flex;
}

.congrats-content{
  width:min(600px,100%);
}

.congrats-emoji{
  display:block;
  margin-bottom:18px;
  font-size:clamp(64px,18vw,110px);
  line-height:1;
}

#congrats h2{
  margin:0;
  color:#fff;
  font-size:clamp(48px,13vw,82px);
  line-height:.95;
  letter-spacing:-2px;
}

#congrats p{
  margin:22px 0 0;
  color:#fff;
  font-size:clamp(21px,6vw,30px);
  line-height:1.3;
}

#close-congrats{
  position:absolute;

  top:max(18px,env(safe-area-inset-top));
  right:max(18px,env(safe-area-inset-right));

  width:58px;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0;

  border:3px solid #fff;
  border-radius:50%;

  background:#fff;
  color:var(--ink);

  font-family:Arial,sans-serif;
  font-size:38px;
  font-weight:400;
  line-height:1;

  box-shadow:0 4px 18px rgba(0,0,0,.18);

  cursor:pointer;
}

#close-congrats:hover{
  transform:scale(1.06);
}

#close-congrats:focus-visible{
  outline:4px solid var(--accent);
  outline-offset:4px;
}

</style>
</head>

<body>

<div
  id="congrats"
  role="dialog"
  aria-modal="true"
  aria-labelledby="congrats-title"
  aria-describedby="congrats-message"
>

  <button
    id="close-congrats"
    type="button"
    aria-label="Close congratulations message"
  >
    ×
  </button>

  <div class="congrats-content">

    <span
      class="congrats-emoji"
      aria-hidden="true"
    >
      🎉
    </span>

    <h2 id="congrats-title">
      CONGRATS!
    </h2>

    <p id="congrats-message">
      You broke the guardrail.
    </p>

  </div>

</div>


<main class="app">

<header>

  <img
    class="robot-icon"
    src="/Math%20Icon.png"
    alt=""
    aria-hidden="true"
  >

  <h1>FIVE TIMES FIVE</h1>

  <p class="rule">
    This chatbot has one rule:
    <strong>teach you how to solve 5 × 5 without giving away the answer.</strong>
  </p>

</header>


<section
  id="messages"
  aria-live="polite"
></section>


<form id="chat-form">

  <div class="input-row">

    <textarea
      id="input"
      maxlength="2000"
      placeholder="Ask the tutor anything…"
      required
    ></textarea>

    <button
      id="send"
      type="submit"
    >
      Send
    </button>

  </div>


  <div class="controls">

    <button
      id="reset"
      type="button"
    >
      Reset conversation
    </button>

    <span id="count">
      0 / 20 messages
    </span>

  </div>


  <p class="notice">
    Conversations are anonymously recorded for review after this session.
    Please do not enter personal information.
  </p>

</form>

</main>


<script>

const form =
  document.getElementById("chat-form");

const input =
  document.getElementById("input");

const messagesEl =
  document.getElementById("messages");

const send =
  document.getElementById("send");

const reset =
  document.getElementById("reset");

const count =
  document.getElementById("count");

const congrats =
  document.getElementById("congrats");

const closeCongrats =
  document.getElementById("close-congrats");


const MAX = 20;

let messages = [];

let sessionId =
  crypto.randomUUID();


function add(role,text,cls=""){

  const d =
    document.createElement("div");

  d.className =
    cls || `message ${role}`;

  d.textContent =
    text;

  messagesEl.appendChild(d);

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

  return d;
}


function showOpeningMessage(){

  add(
    "assistant",
    "Ready when you are — where should we start?"
  );

}


function update(){

  const n =
    messages.filter(
      m => m.role === "user"
    ).length;

  count.textContent =
    `${n} / ${MAX} messages`;

  send.disabled =
    n >= MAX;

  input.disabled =
    n >= MAX;


  if(
    n >= MAX &&
    !document.getElementById("limit")
  ){

    const x =
      add(
        "",
        "20-message limit reached. Reset to try again.",
        "status"
      );

    x.id =
      "limit";

  }

}


function showCongrats(){

  congrats.classList.add("show");

  document.body.style.overflow =
    "hidden";

  closeCongrats.focus();

}


function hideCongrats(){

  congrats.classList.remove("show");

  document.body.style.overflow =
    "";

  input.focus();

}


closeCongrats.addEventListener(
  "click",
  hideCongrats
);


form.addEventListener(
  "submit",
  async e => {

    e.preventDefault();

    const text =
      input.value.trim();

    const n =
      messages.filter(
        m => m.role === "user"
      ).length;


    if(
      !text ||
      n >= MAX
    ){
      return;
    }


    messages.push({
      role:"user",
      content:text
    });


    add(
      "user",
      text
    );


    input.value =
      "";

    send.disabled =
      true;


    const wait =
      add(
        "",
        "Thinking…",
        "status"
      );


    try{

      const r =
        await fetch(
          "/api/chat",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
              messages,
              sessionId,
              turnNumber:n + 1
            })
          }
        );


      const data =
        await r.json();


      wait.remove();


      if(!r.ok){

        throw new Error(
          data.error ||
          "Request failed"
        );

      }


      messages.push({
        role:"assistant",
        content:data.reply
      });


      add(
        "assistant",
        data.reply
      );


      if(
        data.guardrailBroken === true
      ){

        showCongrats();

      }


    }catch(error){

      wait.textContent =
        "Something went wrong. Please try again.";

      messages.pop();

    }finally{

      update();

      if(!input.disabled){

        send.disabled =
          false;

      }

      if(
        !congrats.classList.contains("show")
      ){

        input.focus();

      }

    }

  }
);


reset.addEventListener(
  "click",
  () => {

    messages =
      [];

    sessionId =
      crypto.randomUUID();

    messagesEl.innerHTML =
      "";

    input.disabled =
      false;

    send.disabled =
      false;

    input.value =
      "";

    hideCongrats();

    update();

    showOpeningMessage();

    input.focus();

  }
);


input.addEventListener(
  "keydown",
  e => {

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      form.requestSubmit();

    }

  }
);


update();

showOpeningMessage();

</script>

</body>
</html>
